name: aarch64_cortex-a53 tutuicmptunnel

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
  watch:
    types: started

env:
  SDK_URL: https://downloads.immortalwrt.org/releases/25.12.0/targets/qualcommax/ipq807x/
  SDK_NAME: ipq807x-immortalwrt-25.12.0
  TT_VERSION: aarch64_cortex-a53-20261119
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y $(curl -fsSL https://raw.githubusercontent.com/nantayo/My-Pkg/master/openwrt) > /dev/null
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        SDK_FILE=$(curl -fsSL "$SDK_URL" | grep -oE 'immortalwrt-sdk-25\.12\.0-qualcommax-ipq807x_[^"]+\.tar\.zst' | head -n 1)
        echo "Downloading $SDK_FILE..."
        wget -q "${SDK_URL}${SDK_FILE}"
        tar --zstd -xf "$SDK_FILE"
        mv immortalwrt-sdk-25.12.0-qualcommax-ipq807x_* openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load and select tutuicmptunnel (代替 make menuconfig)
      run: |
        cd openwrt
        git clone https://github.com/hrimfaxi/openwrt-tutuicmptunnel-kmod package/tutuicmptunnel
        ./scripts/feeds update -a
        ./scripts/feeds install libmnl

        # 1. 生成默认 .config 以扫描出所有包配置项
        make defconfig

        # 2. 动态匹配 tutuicmptunnel 相关的所有 CONFIG_PACKAGE_ 项并设为 =y（自动兼容 kmod-tutuicmptunnel）
        grep -E "^# CONFIG_PACKAGE_.*tutuicmptunnel is not set" .config | sed 's/# \(CONFIG_PACKAGE_[^ ]*\) is not set/\1=y/' >> .config
        
        # 3. 再次运行 defconfig 自动解析并选中依赖（如 libmnl 等）
        make defconfig

        # 打印确认已选中的配置项
        grep -i "tutuicmptunnel" .config

    - name: Compile tutuicmptunnel
      run: |
        cd openwrt
        # 直接通过 KCFLAGS 放宽 C90 变量声明顺序限制并关闭将警告视为错误
        KCFLAGS="-std=gnu11 -Wno-declaration-after-statement" make package/tutuicmptunnel/compile V=s

        # 收集生成的 ipk/apk
        mkdir -p /workdir/release_files
        find bin/ -type f \( -name "*tutu*.ipk" -o -name "*tutu*.apk" \) -exec cp -v {} /workdir/release_files/ \;
        ls -lh /workdir/release_files/

    - name: Check output files
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        if [ -n "$(ls -A /workdir/release_files 2>/dev/null)" ]; then
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "No ipk/apk files found!"
          exit 1
        fi

    - name: Upload Package to release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.TT_VERSION }}
        files: /workdir/release_files/*
